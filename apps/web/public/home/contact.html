<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Contact | RoadVision</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="Contact Unikorn for CCTV, ANPR, networking, and RoadVision deployments. Dankuni-based engineers, 24/7 support.">
    <link href="/img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/lib/animate/animate.min.css" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <script src="/js/site-shell.js"></script>
    <script>RV.writeChrome("contact"); RV.writePageHeader("Contact Us", "Contact");</script>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-5">
                    <div class="bg-primary mb-3" style="width: 60px; height: 2px;"></div>
                    <h1 class="display-5 mb-4">Talk to an engineer</h1>
                    <p class="mb-4">Tell us about the corridor, campus, or camera network. We reply with a practical deployment plan&mdash;not a generic brochure.</p>
                    <p class="mb-2"><i class="fa fa-map-marker-alt text-primary me-3"></i>Unikorn, 42 Station Pally, Dankuni - 712311</p>
                    <p class="mb-2"><i class="fa fa-phone-alt text-primary me-3"></i><a href="tel:+918100044473">+91 8100044473</a></p>
                    <p class="mb-4"><i class="fa fa-envelope text-primary me-3"></i><a href="mailto:info@unikorncam.tech">info@unikorncam.tech</a></p>
                    <p class="mb-0"><i class="far fa-clock text-primary me-3"></i>24/7 customer support for live sites</p>
                </div>
                <div class="col-lg-7">
                    <form id="contact-form" class="bg-light p-4 p-lg-5">
                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label" for="contact-name">Your name</label>
                                <input id="contact-name" name="name" type="text" class="form-control border-0" style="height: 55px;" required minlength="2">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label" for="contact-email">Email</label>
                                <input id="contact-email" name="email" type="email" class="form-control border-0" style="height: 55px;" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label" for="contact-phone">Mobile</label>
                                <input id="contact-phone" name="phone" type="tel" class="form-control border-0" style="height: 55px;" required minlength="8">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label" for="contact-service">Service</label>
                                <select id="contact-service" name="service" class="form-select border-0" style="height: 55px;" required>
                                    <option value="">Select a service</option>
                                    <option value="traffic-analysis">Traffic Analysis</option>
                                    <option value="anpr-recognition">ANPR Recognition</option>
                                    <option value="road-condition-ai">Road Condition AI</option>
                                    <option value="highway-cctv-intel">Highway CCTV Intel</option>
                                    <option value="fleet-dashcam-survey">Fleet Dashcam Survey</option>
                                    <option value="networking">Networking Infrastructure</option>
                                    <option value="support">24/7 Support</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="contact-message">How can we help?</label>
                                <textarea id="contact-message" name="message" class="form-control border-0" rows="5" required minlength="10" placeholder="Cameras, locations, and what you need to measure or enforce."></textarea>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100 py-3" type="submit">Send message</button>
                            </div>
                            <div class="col-12">
                                <p id="contact-status" class="small mb-0" role="status"></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>RV.writeFooter(); RV.bindContactForm();</script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/wow/wow.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
